name: Build and Push Docker Images

# Automated multi-architecture builds for botiverse/raft-source.
#
# The upstream repository ships production Dockerfiles under packages/*/,
# but publishes no public image workflow (its own CI builds images via
# private scripts). This workflow checks upstream daily, and only when that
# commit has not been built yet, builds and pushes:
#
#   raft-server        <- packages/server/Dockerfile
#   raft-web           <- packages/web/Dockerfile
#   raft-trace-upload  <- packages/trace-upload-worker/Dockerfile
#
# to Docker Hub and GHCR as linux/amd64 + linux/arm64. Images also carry the
# upstream release version as a tag (e.g. v1.21.2 and v1.21.2-source.1), since
# the release mirror tags each release commit.

on:
  schedule:
    # Daily at 00:00 UTC — build only when upstream has new commits.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push images to registries'
        required: false
        default: true
        type: boolean
      force_build:
        description: 'Force build even if this commit was already built'
        required: false
        default: false
        type: boolean
      vite_api_url:
        description: "VITE_API_URL baked into the web image (empty = same-origin reverse proxy)"
        required: false
        default: ''
        type: string

env:
  SOURCE_REPO: botiverse/raft-source
  SOURCE_BRANCH: main
  # GHCR package names checked by the change detector and pushed by the build matrix.
  IMAGES: 'raft-server raft-web raft-trace-upload'

permissions:
  contents: read
  packages: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      current_sha: ${{ steps.check.outputs.current_sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      build_date: ${{ steps.check.outputs.build_date }}
      build_at: ${{ steps.check.outputs.build_at }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
    steps:
      - name: Checkout source repository (${{ env.SOURCE_REPO }})
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          # Full history + tags so `git describe --tags` can resolve the
          # release tag for this commit (the release mirror is tiny).
          fetch-depth: 0
          fetch-tags: true

      - name: Check for changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y%m%d')
          BUILD_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          # The release mirror tags every release commit (vX.Y.Z-source.N).
          # Carry the real application version through to image tags/labels;
          # falls back to nothing when a commit has no exact tag.
          UPSTREAM_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          UPSTREAM_VERSION=""
          if [ -n "$UPSTREAM_TAG" ]; then
            UPSTREAM_VERSION=$(printf '%s' "$UPSTREAM_TAG" | sed -E 's/-source\.[0-9]+$//')
          fi

          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "build_at=${BUILD_AT}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Upstream release: ${UPSTREAM_TAG:-none} (version ${UPSTREAM_VERSION:-none})"

          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Force build requested"
            exit 0
          fi

          # Manual runs always build; scheduled runs only when this commit has
          # not been built yet (all three images carry a sha-<commit> tag).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual build requested"
            exit 0
          fi

          ALL_EXIST=true
          for image in ${IMAGES}; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${{ github.repository_owner }}/${image}/manifests/sha-${SHORT_SHA}" || true)
            if [ "$CODE" != "200" ]; then
              ALL_EXIST=false
              echo "::notice::${image}:sha-${SHORT_SHA} not found (HTTP ${CODE}) — build required"
            fi
          done

          if [ "$ALL_EXIST" = "true" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::All images already carry sha-${SHORT_SHA}; skipping build"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: raft-server
            dockerfile: packages/server/Dockerfile
            description: Raft API server (realtime, persistence, integrations)
          - name: web
            image: raft-web
            dockerfile: packages/web/Dockerfile
            description: Raft web client (Vite build served by nginx)
          - name: trace-upload-worker
            image: raft-trace-upload
            dockerfile: packages/trace-upload-worker/Dockerfile
            description: Raft trace upload worker
    steps:
      - name: Checkout source repository (${{ env.SOURCE_REPO }})
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-changes.outputs.build_date }}
            type=raw,value=sha-${{ needs.check-changes.outputs.short_sha }}
            type=raw,value=${{ needs.check-changes.outputs.upstream_version }},enable=${{ needs.check-changes.outputs.upstream_version != '' }}
            type=raw,value=${{ needs.check-changes.outputs.upstream_tag }},enable=${{ needs.check-changes.outputs.upstream_tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }} — community build of botiverse/raft-source
            org.opencontainers.image.url=https://raft.build
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_REPO }}
            org.opencontainers.image.revision=${{ needs.check-changes.outputs.current_sha }}
            org.opencontainers.image.version=${{ needs.check-changes.outputs.upstream_tag || needs.check-changes.outputs.short_sha }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event.inputs.push_image != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Each image consumes its own subset of these args; buildx treats the
          # rest as unused-with-warning, which is harmless. VITE_API_URL only
          # affects the web image (baked in at build time).
          build-args: |
            RAFT_RELEASE_SHA=${{ needs.check-changes.outputs.current_sha }}
            RAFT_BUILD_AT=${{ needs.check-changes.outputs.build_at }}
            RAFT_RELEASE_BRANCH=${{ env.SOURCE_BRANCH }}
            RAFT_IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            SLOCK_RELEASE_SHA=${{ needs.check-changes.outputs.current_sha }}
            SLOCK_BUILD_AT=${{ needs.check-changes.outputs.build_at }}
            SLOCK_RELEASE_BRANCH=${{ env.SOURCE_BRANCH }}
            VITE_API_URL=${{ github.event.inputs.vite_api_url || '' }}
            VITE_COMMIT_SHA=${{ needs.check-changes.outputs.current_sha }}
            VITE_BUILD_AT=${{ needs.check-changes.outputs.build_at }}
            VITE_RELEASE_BRANCH=${{ env.SOURCE_BRANCH }}
            VITE_FRONTEND_RELEASE_ID=${{ needs.check-changes.outputs.upstream_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Generate summary
        run: |
          {
            echo "## Docker image built: \`${{ matrix.image }}\`"
            echo ""
            echo "**Upstream release:** \`${{ needs.check-changes.outputs.upstream_tag || 'unknown' }}\`"
            echo ""
            echo "**Source commit:** \`${{ needs.check-changes.outputs.short_sha }}\`"
            echo ""
            echo "**Build date:** \`${{ needs.check-changes.outputs.build_date }}\`"
            echo ""
            echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "### Docker Hub"
            echo ""
            echo "\`${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest\`"
            echo ""
            echo "### GitHub Container Registry"
            echo ""
            echo "\`ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  skip-notification:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip notification
        run: |
          {
            echo "## Build skipped"
            echo ""
            echo "No new upstream commits detected since the last build."
            echo ""
            echo "**Current release:** \`${{ needs.check-changes.outputs.upstream_tag || 'unknown' }}\`"
            echo ""
            echo "**Current commit:** \`${{ needs.check-changes.outputs.short_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
